<style>

  .logo{font-weight:800;color:var(--pink-d);font-size:20px;user-select:none}
  .langs{display:flex;gap:6px}
  .lang{border:2px solid var(--pink);background:#fff;color:var(--pink-d);border-radius:20px;padding:8px 14px;font-size:16px;font-weight:700;cursor:pointer}
  .lang.on{background:var(--pink);color:#fff}
  .dots{display:flex;gap:6px;justify-content:center}
  .dot{width:10px;height:10px;border-radius:50%;background:#f3c1d1}.dot.on{background:var(--pink)}
  .card{background:var(--card);border-radius:24px;padding:22px 18px;box-shadow:0 6px 24px #d6336c22;text-align:center}
  .emoji{font-size:84px;line-height:1.1}
  .big{font-size:26px;font-weight:800;line-height:1.35;margin:10px 0 4px}
  .sub{font-size:18px;color:#6b4a57;margin:6px 0}
  .btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;border:0;border-radius:20px;padding:20px 14px;font-size:26px;font-weight:800;color:#fff;cursor:pointer;margin-top:12px;font-family:inherit}

  .yes{background:var(--green)}.no{background:var(--red)}.pink{background:var(--pink)}
  .ghost{background:#fff;color:var(--pink-d);border:3px solid var(--pink);font-size:20px;padding:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .listen{background:#fff0f5;color:var(--pink-d);border:3px solid var(--pink);font-size:20px;padding:12px;margin-top:6px}
  .mic.rec{background:#c92a2a;animation:pulse 1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 14px #c92a2a33}}
  ul.list{list-style:none;padding:0;margin:8px 0;text-align:left}
  ul.list li{font-size:21px;padding:11px 8px;border-bottom:1px solid #f6d3df;display:flex;gap:12px;align-items:center}
  ul.list li span.i{font-size:32px}
  .ans{background:#fff0f5;border-radius:16px;padding:14px;font-size:20px;text-align:left;margin-top:12px;white-space:pre-wrap}
  .note{font-size:13px;color:#8a6a76;text-align:center}
  #set{display:none;background:#fff;border-radius:16px;padding:12px;font-size:14px}
  #set input{width:100%;padding:8px;margin:6px 0}
  a.call{text-decoration:none}

    const u = new SpeechSynthesisUtterance(text);
    u.lang = L().code; u.rate = 0.9;
    const v = speechSynthesis.getVoices().find(v=>v.lang.replace('_','-').toLowerCase()===L().code.toLowerCase()) ||
              speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(lang));
    if(v) u.voice = v;
    speechSynthesis.speak(u);
  }catch(e){}
}
if('speechSynthesis' in window) speechSynthesis.onvoiceschanged = ()=>{};

// ---------- Voice in ----------
function listen(onText, onFail){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SR){ onFail(L().nomic); return; }
  try{ speechSynthesis.cancel(); }catch(e){}
  recog = new SR(); recog.lang = L().code; recog.interimResults = false; recog.maxAlternatives = 1;
  let got = false;
  recog.onresult = e => { got = true; onText(e.results[0][0].transcript); };
  recog.onerror = () => { if(!got) onFail(L().noheard); };
  recog.onend = () => { document.querySelectorAll('.mic').forEach(b=>b.classList.remove('rec')); if(!got) onFail(L().noheard); };
  recog.start();
}
const YES = /हाँ|हां|हा\b|जी|ठीक|सही|yes|yeah|అవును|ఔను|అవునండి/i;
const NO  = /नहीं|नही|ना\b|no\b|కాదు|లేదు|కాదండి/i;

// ---------- Render ----------
function dots(){
  const n = L().qs.length + 2; // welcome + qs + result
  $('#dots').innerHTML = Array.from({length:n},(_,i)=>`<div class="dot ${i<=step?'on':''}"></div>`).join('');
}
function listenBtn(text){ return `<button class="btn listen" onclick='say(${JSON.stringify(text)})'>${L().listen}</button>`; }

function render(){
  dots();
  const t = L(), qn = t.qs.length;
  if(step===0){
    main.innerHTML = `<div class="card"><div class="emoji">🌸</div><div class="big">${t.welcomeTitle}</div><div class="sub">${t.welcomeSub}</div>
      <button class="btn yes" id="go">▶️ ${t.start}</button>${listenBtn(t.startVoice)}</div>`;
    $('#go').onclick = ()=>{ eligible=true; step=1; render(); };
    say(t.startVoice);
  } else if(step<=qn){
    const q = t.qs[step-1];
    main.innerHTML = `<div class="card"><div class="emoji">${q.e}</div><div class="big">${q.t}</div>
      ${listenBtn(q.t)}
      <div class="row"><button class="btn yes" id="y">✅ ${t.yes}</button><button class="btn no" id="n">❌ ${t.no}</button></div>
      <button class="btn pink mic" id="mic">${t.speak}</button>
      <div id="msg" class="sub"></div></div>`;
    const answer = ok => { if(!ok) eligible=false; step++; if(step>qn) step=qn+1; render(); };
    $('#y').onclick = ()=>answer(true); $('#n').onclick = ()=>answer(false);
    $('#mic').onclick = e => { e.currentTarget.classList.add('rec'); $('#msg').textContent=t.listening;
      listen(txt=>{ if(YES.test(txt)&&!NO.test(txt)) answer(true); else if(NO.test(txt)) answer(false); else $('#msg').textContent=t.noheard; },
             m=>{ $('#msg').textContent=m; }); };
    say(q.t);
  } else {
    result();
  }
}

function result(){
  const t = L();
  if(!eligible){
    main.innerHTML = `<div class="card"><div class="emoji">🙏</div><div class="big">${t.noTitle}</div>${listenBtn(t.noVoice)}
      <a class="call" href="tel:${t.helpNo}"><button class="btn pink">${t.help}</button></a>
      <button class="btn ghost" id="again">${t.again}</button></div>`;
    $('#again').onclick=()=>{step=0;render()}; say(t.noVoice); return;
  }
  main.innerHTML = `<div class="card"><div class="emoji">🎉</div><div class="big">${t.okTitle}</div>
    ${listenBtn(t.resultVoice)}
    <div class="sub"><b>${t.docsTitle}</b></div>
    <ul class="list">${t.docs.map(d=>`<li><span class="i">${d[0]}</span>${d[1]}</li>`).join('')}</ul>
    <div class="sub"><b>${t.whereTitle}</b></div><div class="ans">${t.where}</div>
    <div class="sub" style="margin-top:14px"><b>${t.moneyTitle}</b></div><div class="ans">${t.money}</div>
    <button class="btn pink" id="ask">${t.ask}</button>
    <a class="call" href="tel:${t.helpNo}"><button class="btn ghost">${t.help}<br>${t.helpNo}</button></a>
    <button class="btn ghost" id="again">${t.again}</button></div>`;
  $('#ask').onclick = askScreen; $('#again').onclick=()=>{step=0;render()};
  say(t.okVoice + ' ' + t.resultVoice);
}

// ---------- Ask a question (Gemini if key present, else built-in FAQ) ----------
function askScreen(){
  const t = L();
  main.innerHTML = `<div class="card"><div class="emoji">🎤</div><div class="big">${t.askTitle}</div>
    <button class="btn pink mic" id="mic">${t.speak}</button>
    <div id="msg" class="sub"></div><div id="out"></div>
    <button class="btn ghost" id="back">${t.back}</button></div>`;
  $('#back').onclick = result;
  $('#mic').onclick = e => { e.currentTarget.classList.add('rec'); $('#msg').textContent=t.listening;
    listen(async q=>{ $('#msg').textContent='“'+q+'”'; await respond(q); }, m=>{ $('#msg').textContent=m; say(m); }); };
  say(t.askVoice);
}
async function respond(q){
  const t = L(); $('#out').innerHTML = `<div class="ans">${t.thinking}</div>`;
  let a = null; const key = store.get('gkey');
  if(key){
    try{
      const ctx = `You are Sakhi Saathi, a kind voice assistant for a rural Indian woman with no tech knowledge. Reply ONLY in ${t.sys}, in at most 3 very short, simple sentences, no English words, no markdown. Topic: PM Matru Vandana Yojana (PMMVY): Rs 5000 in 3 instalments (1000 on pregnancy registration, 2000 after 6 months antenatal check, 2000 after child birth registration and first vaccine cycle) for pregnant and lactating mothers, 19+ years, first living child (second child benefit only if girl). Apply on Form 1-A at Anganwadi centre or via ASHA worker; documents: Aadhaar, bank/post-office passbook in her name, MCP card, mobile number. Helpline 7998799804. If unsure, tell her to ask the Anganwadi worker. Never ask for personal data or OTP.`;
      const r = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent',{
        method:'POST', headers:{'Content-Type':'application/json','x-goog-api-key':key},
        body: JSON.stringify({systemInstruction:{parts:[{text:ctx}]}, contents:[{role:'user',parts:[{text:q}]}]})});
      const j = await r.json(); a = j.candidates?.[0]?.content?.parts?.[0]?.text?.trim();
    }catch(e){ a = null; }
  }
  if(!a){ const hit = t.faq.find(f=>f[0].test(q)); a = hit ? hit[1] : t.fallbackDefault; }
  $('#out').innerHTML = `<div class="ans">${a.replace(/</g,'&lt;')}</div>`; say(a);
}

// ---------- Wiring ----------
document.querySelectorAll('.lang[data-l]').forEach(b=>b.onclick=()=>{
  lang=b.dataset.l; store.set('lang',lang);
  document.querySelectorAll('.lang[data-l]').forEach(x=>x.classList.toggle('on',x===b));
  document.documentElement.lang=lang; render();
});
// Hidden settings: tap logo 5 times
let taps=0; $('#logo').onclick=()=>{ if(++taps>=5){ taps=0; const s=$('#set'); s.style.display='block'; $('#key').value=store.get('gkey')||''; } };
$('#savekey').onclick=()=>{ store.set('gkey',$('#key').value.trim()); $('#set').style.display='none'; };
// Optional: ?key=... is deliberately NOT supported (keys must never be in URLs).
const sl = store.get('lang'); if(sl&&T[sl]){ lang=sl; document.querySelectorAll('.lang[data-l]').forEach(x=>x.classList.toggle('on',x.dataset.l===lang)); document.documentElement.lang=lang; }
render();
</script>
